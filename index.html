 dlg(`<h2>${t=='in'?'استلام':'صرف'}</h2><label>القسم</label><select id="a1">${opt(CATS)}</select><label>الصنف</label><input id="a2" list="il" placeholder="اسم الصنف"><datalist id="il">${opt(items)}</datalist><div class="two"><div><label>الكمية</label><input type="number" id="a3" step="any"></div><div><label>الوحدة</label><input id="a4" value="${t=='in'?'':'' }" placeholder="لتر / كيس / قطعة"></div></div><label>سعر الوحدة (جنيه)</label><input type="number" id="a5" step="any">${t=='in'?'<label>المورد</label><input id="a6"><label>رقم الفاتورة</label><input id="a7">':'<label>للقطعة / العملية</label><select id="a8">'+opt([...allPlots(),...YCODES])+'</select><label>اللي استلم</label><select id="a6">'+opt(WORKERS)+'</select>'}<label>التاريخ</label><input type="date" id="a9" value="${today()}">${photoField()}<button class="btn" onclick="saveStock('${t}')">حفظ</button><button class="btn s" onclick="closeD()">إلغاء</button>`)}

R.money=()=>{
 let h=chips('money',[['cash','التدفق الشهري'],['cost','تكلفة القطع']]);
 if(sub.money=='cash'){const mo=today().slice(0,7),ms=[...new Set([mo,...S.cash.map(c=>c.date.slice(0,7))])].sort().reverse();
  const cm=window.curM||mo;window.curM=cm;
  const rows=S.cash.filter(c=>c.date.slice(0,7)==cm);const tot=k=>rows.filter(c=>c.dir==k).reduce((a,c)=>a+num(c.amt),0);
  h+=`<select onchange="curM=this.value;render()">${ms.map(m=>`<option ${m==cm?'selected':''}>${m}</option>`).join('')}</select>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin:10px 0"><div class="kpi"><b>${fmtM(tot('in'))}</b>داخل</div><div class="kpi"><b>${fmtM(tot('out'))}</b>خارج</div><div class="kpi"><b>${fmtM(tot('in')-tot('out'))}</b>الصافي</div></div>
  <div class="card"><b>المصروفات</b>${CASH.map(c=>`<div class="row"><div class="dot">●</div><div class="t">${c}</div><b>${fmtM(rows.filter(r=>r.dir=='out'&&r.cat==c).reduce((a,r)=>a+num(r.amt),0))}</b></div>`).join('')}</div>
  <div class="two"><button class="btn" onclick="addCash('out')">－ مصروف</button><button class="btn s" onclick="addCash('in')">＋ إيراد</button></div>
  <div class="card" style="margin-top:10px">${rows.map(r=>`<div class="row"><div class="dot">●</div><div class="t">${r.dir=='in'?'إيراد':esc(r.cat)}${r.plot?' · '+esc(r.plot):''}<div class="s">${r.date} ${esc(r.note||'')}</div></div><b>${fmtM(num(r.amt))}</b><button class="tag r" style="border:0" onclick="del('cash',${S.cash.indexOf(r)})">حذف</button></div>`).join('')||'<div class="s">مفيش حركة في الشهر ده.</div>'}</div>`;
 } else {
  const cost={};let ind=0;const add=(p,v)=>cost[p]=(cost[p]||0)+v;
  const isDir=c=>c.kind?c.kind=='direct'&&c.plot&&c.plot!='عام':(c.plot&&c.plot!='عام');
  S.cash.filter(c=>c.dir=='out').forEach(c=>{if(isDir(c))add(c.plot,num(c.amt));else ind+=num(c.amt)});
  S.stock.filter(s=>s.type=='out').forEach(s=>{const v=num(s.qty)*num(s.price);if(s.plot&&s.plot!='عام')add(s.plot,v);else ind+=v});
  const base=GROUPS.reduce((a,g)=>a+g[1],0),sh=g=>ind*g[1]/base;
  h+=`<div class="card"><table><tr><th>القطعة</th><th>فدان</th><th>مباشرة</th><th>غير مباشرة (بالفدان)</th><th>الإجمالي</th><th>للفدان</th></tr>${GROUPS.map(g=>{const d=cost[g[0]]||0,x=sh(g);return `<tr><td>${g[0]}</td><td>${g[1]}</td><td>${fmtM(d)}</td><td>${fmtM(x)}</td><td><b>${fmtM(d+x)}</b></td><td>${fmtM((d+x)/g[1])}</td></tr>`}).join('')}${[...new Set([...S.plots,'عام',...Object.keys(cost)])].filter(x=>!GROUPS.some(g=>g[0]==x)&&cost[x]).map(p=>`<tr><td>${esc(p)}</td><td>-</td><td>${fmtM(cost[p])}</td><td>-</td><td><b>${fmtM(cost[p])}</b></td><td>-</td></tr>`).join('')}<tr><td><b>غير مباشرة (إجمالي)</b></td><td>${base}</td><td>-</td><td>${fmtM(ind)}</td><td>-</td><td>-</td></tr></table></div><div class="note">مباشرة = مصروف أو صرف مخزن مربوط بقطعة. غير مباشرة = مصروفات عامة (بدون قطعة أو اخترتها غير مباشرة)، بتتوزع على النخيل والعنب بنسبة الفدان. الحساب بالكسور الكاملة والعرض بالجنيه. المصروفات القديمة: اللي ليها قطعة = مباشرة، والباقي غير مباشرة.</div>`;
 }
 return h};
function addCash(d){dlg(`<h2>${d=='out'?'مصروف':'إيراد'}</h2>${d=='out'?'<label>البند</label><select id="a1">'+opt(CASH)+'</select>':'<label>مصدر الإيراد</label><input id="a1" placeholder="مبيعات ..">'}<label>المبلغ (جنيه)</label><input type="number" id="a2" step="any">${d=='out'?'<label>نوع التكلفة</label><select id="a6"><option value="direct">مباشرة (على قطعة)</option><option value="indirect">غير مباشرة (عامة)</option></select>':''}<label>القطعة (اختياري)</label><select id="a3"><option value="">-</option>${opt([...allPlots(),...YCODES])}</select><label>التاريخ</label><input type="date" id="a4" value="${today()}"><label>ملاحظة</label><input id="a5"><button class="btn" onclick="if(!num(f('a2')))return alert('اكتب المبلغ');if('${d}'=='out'&&f('a6')=='direct'&&!f('a3'))return alert('اختار القطعة للتكلفة المباشرة');S.cash.push({dir:'${d}',kind:'${d}'=='out'?f('a6'):'',cat:f('a1'),amt:f('a2'),plot:f('a6')=='indirect'?'':(typeof grpOf=='function'?grpOf(f('a3')):f('a3')),yard:f('a6')=='indirect'?'':(YARDS[f('a3')]?f('a3'):''),date:f('a4'),note:f('a5')});save();closeD();render()">حفظ</button><button class="btn s" onclick="closeD()">إلغاء</button>`)}

 ${t.pos?`<div class="s">📍 <a href="https://www.google.com/maps?q=${t.pos.lat},${t.pos.lon}" target="_blank">${t.pos.lat}, ${t.pos.lon}</a></div>`:''}${t.photo?`<img class="ph" src="${t.photo}" style="width:100%;height:150px;margin-top:6px">`:''}

<script>

S.seed=S.seed||[];if(!S.seedInit2){[[['B17','C17'],5984],[['B18','C18'],5984],[['B19','C19'],5984],[['B20','C20'],5984],[['B16'],3080],[['C16'],2816]].forEach(function(g){var ov=S.seed.some(function(x){return x.yards.some(function(y){return g[0].indexOf(y)>=0})});if(!ov)S.seed.push({id:Date.now()+Math.floor(Math.random()*1e6),yards:g[0],n:g[1],dens:700})});S.seedInit=1;S.seedInit2=1;save()}
