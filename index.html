<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<meta name="theme-color" content="#2f6b3a"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="طايو"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="icon" type="image/png" href="icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700&display=swap" rel="stylesheet"><meta name="apple-mobile-web-app-capable" content="yes"><meta property="og:title" content="طايو · دير مواس"><meta property="og:description" content="تطبيق إدارة مزرعة طايو للاستثمار الزراعي والصناعي"><meta property="og:image" content="https://tayo-farm.github.io/og.jpg"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://tayo-farm.github.io/og.jpg"><title>طايو · دير مواس</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;background:#f4f1e8;color:#23301f;padding-bottom:90px;font-size:14px}
header{background:linear-gradient(160deg,#2f6b3a,#4f8a3c);color:#fff;padding:22px 18px 18px;border-radius:0 0 26px 26px}
header small{opacity:.85;font-size:12px}header h1{font-size:20px;margin-top:3px}
main{padding:14px}h2{font-size:15px;margin:14px 2px 8px}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(40,50,30,.07)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border-radius:14px;padding:10px;text-align:center;font-size:11px;color:#7a8570}.kpi b{display:block;font-size:20px;color:#23301f}
.plot{border-radius:16px;padding:14px;color:#fff;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}.plot .n{font-size:26px;font-weight:700}.plot .n span{font-size:12px;font-weight:400}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-radius:20px 20px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.1);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 2px 12px;font:inherit;font-size:11px;color:#8a937f}nav button.on{color:#2f6b3a;font-weight:700}nav i{display:block;font-style:normal;font-size:18px}
label{display:block;font-size:12px;color:#6b705f;margin:8px 0 3px}
input,select,textarea{width:100%;border:1.5px solid #d9d5c4;border-radius:10px;padding:10px;font:inherit;background:#fff}
.btn{display:block;width:100%;border:0;background:#2f6b3a;color:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:700;margin-top:10px}
.btn.s{background:#e6efd9;color:#2f6b3a}.btn.o{background:#b7791f}.btn.r{background:#c0392b}
.row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.row .t{flex:1}.row .s{font-size:11px;color:#7a8570}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:#e6efd9;color:#2f6b3a;white-space:nowrap}.tag.o{background:#fdebd0;color:#b7791f}.tag.r{background:#fadbd8;color:#b03a2e}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chips button{border:0;background:#fff;border-radius:20px;padding:7px 12px;font:inherit;font-size:12px}.chips button.on{background:#2f6b3a;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:12px}th{color:#7a8570;font-weight:400;text-align:center;padding:6px 2px;border-bottom:1px solid #eee}td{text-align:center;padding:8px 2px;border-bottom:1px solid #f1efe6}td:first-child{text-align:right;font-weight:700}
.note{font-size:11px;color:#9aa38f;text-align:center;margin:8px 0}img.ph{width:54px;height:54px;object-fit:cover;border-radius:8px}
dialog{border:0;border-radius:18px;padding:14px;width:92%;max-width:420px;margin:auto}dialog::backdrop{background:rgba(0,0,0,.4)}
.road{background:repeating-linear-gradient(90deg,#8a8575 0 8px,#a39e8d 8px 16px);height:14px;border-radius:4px;margin:6px 0;color:#fff;font-size:9px;text-align:center}
.mr{display:flex;gap:4px;margin-bottom:3px;align-items:center;font-size:10px}.mr b{width:20px;color:#7a8570}.mr span.c{flex:1;background:#e4e0d2;border:1px dashed #c9c3ae;border-radius:6px;text-align:center;padding:4px 0}.mr span.w{background:#2b7a8c;color:#fff;border-radius:8px;padding:2px 5px}
.dot{width:38px;height:38px;border-radius:12px;background:#e6efd9;display:flex;align-items:center;justify-content:center;font-size:16px;color:#2f6b3a;flex:none}
header .hb{margin-top:10px;display:flex;gap:8px;font-size:12px}header .hb span{background:rgba(255,255,255,.2);padding:5px 12px;border-radius:20px}header .hb .w{background:#fff;color:#2f6b3a;font-weight:700}
.seg{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 8px}.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px}
.mr{font-size:11px;gap:5px;margin-bottom:4px}.mr b{width:22px;font-size:10px}.mr span.c{height:26px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:#6b705f;border-width:1.5px}.mr span.c.e{background:transparent;border:0}
.mr span.w{width:48px;text-align:center;border-radius:8px;font-size:10px;padding:2px 0;flex:none}.mr span.w:empty{background:none}
.st{font-size:11px;font-weight:700;color:#2f6b3a;margin:8px 0 4px;border-bottom:1px solid #cfd8c0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:0;background:#fff;border-radius:18px;padding:16px 14px;text-align:right;font:inherit;box-shadow:0 2px 8px rgba(40,50,30,.07);min-height:92px;display:flex;flex-direction:column;gap:8px;color:#23301f}.tile b{font-size:15px}.tile span{font-size:12px;color:#7a8570}
.cover{display:block;width:100%;border-radius:18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(40,50,30,.12)}
#splash{position:fixed;inset:0;z-index:99999;background:#eef4e2;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}#splash img{width:100%;max-width:560px;display:block}#splash small{margin-top:18px;color:#5b6b4f;font-size:12px}#splash.x{opacity:0;pointer-events:none}
</style></head><body><div id="splash" onclick="hideSplash()"><img src="banner.jpg" alt="طايو · دير مواس"><small>اضغط للدخول</small></div><script>function hideSplash(){var s=document.getElementById("splash");if(s){s.classList.add("x");setTimeout(function(){s.remove()},600)}}try{if(sessionStorage.getItem("sp")){var q=document.getElementById("splash");q&&q.remove()}else{sessionStorage.setItem("sp","1");setTimeout(hideSplash,2800)}}catch(e){setTimeout(hideSplash,2800)}</script>
<header><small id="hs"></small><h1 id="ht"></h1><div class="hb" id="hb"></div></header>
<main id="m"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const GROUPS=[['نخيل',15,'#b7791f'],['عنب ايرلي فيليم',10,'#7b3f8c'],['H4 منتج',20,'#2f6b3a'],['H4 تربية',20,'#2b7a8c']];
const CATS=['أسمدة','مبيدات','سولار','بنزين','معدات وأدوات','مستلزمات سكن','قطع غيار'];
const CASH=['صيانة','عمالة مؤقتة','مرتبات العمالة الدائمة','علاج','إكراميات','كهرباء','مستلزمات سكن','معدات وأدوات','أخرى'];
const OPS=['تقليم','تربية','حشائش','ري','تسميد','رش','تلقيح','حصاد','تنضيف','أخرى'];
const CROPS=['عنب','نخيل - فسائل','نخيل - منتج','بصل','أخرى'];
const BLOCKS=['A','B','C'];
const WORKERS=['عامل الري','سواق الجرار','سواق عربية النيسان','عامل 1','عامل 2','عامل 3','عامل 4','عامل 5','مهندس 1','مهندس 2','المحاسب'];
const TABS=[['home','الرئيسية','🏡'],['crops','المحاصيل','🌱'],['stores','المخازن','📦'],['money','الحسابات','💰'],['more','المزيد','☰']];
let S=JSON.parse(localStorage.getItem('tayo')||'null')||{plots:['قطعة 19','قطعة 20','الأسوار (جازورين)','عام'],grapes:['ايرلي فيليم'],logs:[],stock:[],cash:[],missing:[],visits:[],tasks:[],fence:{done:0,total:5}};
S=JSON.parse(JSON.stringify(S).replace(/[إا]يرلي سويت/g,'ايرلي فيليم'));
const save=()=>{try{localStorage.setItem('tayo',JSON.stringify(S))}catch(e){alert('المساحة امتلت. اعمل نسخة احتياطية من (المزيد) وامسح صور قديمة.')}};
const allPlots=()=>[...GROUPS.map(g=>g[0]),...S.plots];
const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
const today=()=>new Date().toISOString().slice(0,10);
const num=v=>+v||0, fmt=n=>n.toLocaleString('ar-EG',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab=(location.hash.slice(1)||'home'),sub={crops:'ops',stores:'bal',money:'cash',team:'tasks',more:'main'};
function nav(){ $('#nav').innerHTML=TABS.map(t=>`<button class="${(t[0]==tab||(tab=='land'&&t[0]=='home')||(tab=='sec'&&t[0]=='more')||(tab=='team'&&t[0]=='more'))?'on':''}" onclick="go('${t[0]}')"><i>${t[2]}</i>${t[1]}</button>`).join('')}
function go(t){tab=t;render();scrollTo(0,0)}
function chips(key,list){return `<div class="chips">`+list.map(([k,l])=>`<button class="${sub[key]==k?'on':''}" onclick="sub['${key}']='${k}';render()">${l}</button>`).join('')+`</div>`}
function dlg(html){const d=$('#dlg');d.innerHTML=html;d.showModal()}
function close(){$('#dlg').close()}
function f(id){return $('#'+id).value}
function resize(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.55))};im.src=r.result};r.readAsDataURL(file)}
let tmpPhoto='';
function photoField(){tmpPhoto='';return `<label>صورة (اختياري)</label><input type="file" accept="image/*" capture="environment" onchange="resize(this.files[0],d=>{tmpPhoto=d;$('#pv').src=d;$('#pv').style.display='block'})"><img id="pv" class="ph" style="display:none;margin-top:6px">`}
function del(key,i){if(confirm('تحذف السطر ده؟')){S[key].splice(i,1);save();render()}}
const R={};
R.home=()=>{
 const tk=S.tasks.filter(t=>!t.end).length;
 return `<img class="cover" src="banner.jpg" alt="دير مواس"><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><b>520</b>فدان إجمالي</div><div class="kpi"><b>65</b>فدان مزروع</div><div class="kpi"><b>${tk}</b>مهام شغالة</div></div>
 <h2>المزروع (65 فدان من 520)</h2><div class="grid">${GROUPS.map(g=>`<div class="plot" style="background:${g[2]}"><b>${g[0]}</b><div class="n">${g[1]} <span>فدان</span></div></div>`).join('')}</div>
 <h2>آخر الأعمال</h2><div class="card">${S.logs.slice(-4).reverse().map(l=>`<div class="row"><div class="dot">●</div><div class="t">${esc(l.op)} · ${esc(l.plot)}<div class="s">${l.date} ${esc(l.who||'')}</div></div></div>`).join('')||'<div class="s">لسه مفيش. سجّل من (المحاصيل).</div>'}</div>
 <button class="btn s" onclick="go('land')">🗺️ خريطة الأرض وتقسيم القطع</button>`};
R.land=()=>{const PL=[["P",30,[4.0,5.0,6.5],10],["P",29,[5.0,3.85,5.4],null],["P",28,[5.0,6.5,7.5],null],["P",27,[4.0,6.5,6.25],9],["P",26,[4.0,6.0,7.5],null],["P",25,[5.0,5.0,6.5],null],["P",24,[5.5,5.89,8.25],8],["P",23,[5.5,5.89,8.25],null],["P",22,[5.5,5.89,8.25],null],["P",21,[5.5,5.89,8.25],null],["P",20,[5.5,5.89,8.25],7],["P",19,[5.5,5.89,8.25],null],["P",18,[5.5,5.89,8.25],null],["P",17,[5.5,5.89,8.25],null],["P",16,[5.5,5.89,8.25],6],["R","R4"],["P",15,[7.7,8.3,null],null],["P",14,[5.0,5.0,null],5],["P",13,[6.5,6.5,null],4],["R","R3"],["P",12,[5.5,5.89,null],null],["P",11,[5.5,5.89,null],null],["P",10,[5.5,5.89,null],null],["P",9,[5.5,4.0,null],3],["R","R2"],["P",8,[4.0,4.5,null],null],["P",7,[5.5,5.5,null],null],["P",6,[5.5,5.5,null],null],["P",5,[5.5,5.5,null],2],["R","R1"],["P",4,[4.5,4.5,null],null],["P",3,[4.5,4.5,null],null],["P",2,[6.0,6.0,null],1],["P",1,[6.0,6.0,null],null]];const C=[['نخيل',15,'#b7791f'],['عنب ايرلي فيليم',10,'#7b3f8c'],['H4 منتج',20,'#2f6b3a'],['H4 تربية',20,'#2b7a8c']];
 let g='';PL.forEach(r=>{if(r[0]=='R'){g+=`<div class="st">شريط ${r[1]}</div>`;return}g+=`<div class="mr"><b>${r[1]}</b>${r[2].map(x=>x?`<span class="c">${x}</span>`:'<span class="c e"></span>').join('')}<span class="w">${r[3]?'بئر '+r[3]:''}</span></div>`});
 return `<div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><b>520</b>فدان إجمالي</div><div class="kpi"><b>65</b>فدان مزروع</div><div class="kpi"><b>10</b>آبار</div></div>
 <div class="card" style="margin-top:10px"><div class="s" style="color:#7a8570;font-size:12px">المزروع (65 فدان)</div><div class="seg">${C.map(c=>`<i style="width:${c[1]/65*100}%;background:${c[2]}"></i>`).join('')}</div><div class="lg">${C.map(c=>`<span><i style="background:${c[2]}"></i>${c[0]} ${c[1]}</span>`).join('')}</div></div>
 <div class="card" style="display:flex;gap:10px;align-items:center"><div style="width:46px;height:30px;border-radius:6px;flex:none;background:repeating-linear-gradient(90deg,#8a8575 0 8px,#a39e8d 8px 16px)"></div><div style="font-size:12px"><b>طريقين رئيسيين (ممرات)</b><div class="s">عرض حوالي 15 م · طول حوالي 5 كم · مش قطع زراعة، وبيكملوا مساحة الـ520 فدان تقريباً</div></div></div>
 <h2>تقسيم القطع</h2><div class="card" style="padding:10px">${g}<div class="note">المربعات رمادي لحد ما تحدد القطعة بتاعة كل محصول · الأرقام فدان</div></div>
 <a class="btn s" style="text-align:center;text-decoration:none" href="https://www.google.com/maps/search/?api=1&query=27.639592%2C30.568271" target="_blank">🗺️ افتح موقع المزرعة على الخريطة</a>`};
R.crops=()=>{
 let h=chips('crops',[['ops','العمليات'],['miss','الغيابات'],['onion','البصل']]);
 if(sub.crops=='ops'){
  h+=`<button class="btn" onclick="addLog()">＋ تسجيل عملية</button><div class="card" style="margin-top:10px">`+
  (S.logs.map((l,i)=>`<div class="row"><div class="dot">●</div><div class="t">${esc(l.op)} · ${esc(l.crop)} · ${esc(l.plot)}<div class="s">${l.date} · ${esc(l.who||'')} ${l.note?'· '+esc(l.note):''}</div></div><button class="tag r" style="border:0" onclick="del('logs',${i})">حذف</button></div>`).reverse().join('')||'<div class="s">مفيش عمليات مسجلة.</div>')+`</div>`;
 }
 if(sub.crops=='miss'){
  const by={};S.missing.forEach(m=>{by[m.plot]=by[m.plot]||{m:0,r:0};by[m.plot].m+=num(m.count)*(m.kind=='غيابات'?1:0);by[m.plot].r+=num(m.count)*(m.kind=='اتعوض'?1:0)});
  h+=`<button class="btn" onclick="addMiss()">＋ تسجيل غيابات / تعويض</button><div class="card" style="margin-top:10px"><table><tr><th>القطعة</th><th>الغيابات</th><th>اتعوض</th><th>باقي</th></tr>${Object.entries(by).map(([p,v])=>`<tr><td>${esc(p)}</td><td>${v.m}</td><td>${v.r}</td><td>${v.m-v.r}</td></tr>`).join('')||'<tr><td colspan=4 class="s">مفيش تسجيل لسه</td></tr>'}</table></div>`;
 }
 if(sub.crops=='onion'){
  h+=`<div class="card"><b>بصل تحت العنب (قطعة 19 و20)</b><div class="s">سجّل عملياته من تبويب العمليات واختار المحصول "بصل".</div></div><div class="card">`+(S.logs.filter(l=>l.crop=='بصل').map(l=>`<div class="row"><div class="dot">●</div><div class="t">${esc(l.op)} · ${esc(l.plot)}<div class="s">${l.date}</div></div></div>`).join('')||'<div class="s">مفيش عمليات بصل لسه.</div>')+`</div>`;
 }
 return h};
function addLog(){dlg(`<h2>عملية جديدة</h2><label>العملية</label><select id="a1">${opt(OPS)}</select><label>المحصول</label><select id="a2">${opt(CROPS)}</select><label>الصنف (للعنب)</label><select id="a3"><option value="">-</option>${opt(S.grapes)}</select><label>القطعة</label><select id="a4">${opt(allPlots())}</select><label>التاريخ</label><input type="date" id="a5" value="${today()}"><label>مين اشتغل</label><select id="a6">${opt(WORKERS)}</select><label>ملاحظات</label><textarea id="a7" rows="2"></textarea><button class="btn" onclick="S.logs.push({op:f('a1'),crop:f('a2')+(f('a3')?' - '+f('a3'):''),plot:f('a4'),date:f('a5'),who:f('a6'),note:f('a7')});save();close();render()">حفظ</button><button class="btn s" onclick="close()">إلغاء</button>`)}
function addMiss(){dlg(`<h2>غيابات الشجر</h2><label>القطعة (كود)</label><select id="a1">${opt(allPlots())}</select><label>النوع</label><select id="a2"><option>غيابات</option><option>اتعوض</option></select><label>العدد</label><input type="number" id="a3"><button class="btn" onclick="S.missing.push({plot:f('a1'),kind:f('a2'),count:f('a3'),date:today()});save();close();render()">حفظ</button><button class="btn s" onclick="close()">إلغاء</button>`)}
function balances(){const b={};S.stock.forEach(s=>{const k=s.cat+'|'+s.item+'|'+s.unit;b[k]=(b[k]||0)+(s.type=='in'?1:-1)*num(s.qty)});return b}
R.stores=()=>{
 let h=chips('stores',[['bal','الأرصدة'],['mov','الحركة']]);
 h+=`<div class="two"><button class="btn s" onclick="addStock('in')">＋ استلام</button><button class="btn o" onclick="addStock('out')">－ صرف</button></div><div style="height:10px"></div>`;
 if(sub.stores=='bal'){const b=balances();
  h+=CATS.map(c=>{const it=Object.entries(b).filter(([k])=>k.startsWith(c+'|'));return `<div class="card"><b>${c}</b>${it.map(([k,v])=>{const[,n,u]=k.split('|');return `<div class="row"><div class="dot">●</div><div class="t">${esc(n)}</div><span class="tag ${v<=0?'r':''}">${fmt(v)} ${esc(u)}</span></div>`}).join('')||'<div class="s">لا يوجد حركة</div>'}</div>`}).join('');
 } else {h+=`<div class="card">`+(S.stock.map((s,i)=>`<div class="row">${s.photo?`<img class="ph" src="${s.photo}">`:''}<div class="t">${s.type=='in'?'استلام':'صرف'} · ${esc(s.cat)} · ${esc(s.item)} ${fmt(num(s.qty))} ${esc(s.unit)}<div class="s">${s.date} · ${esc(s.party||'')} ${s.plot?'· '+esc(s.plot):''} ${s.inv?'· فاتورة '+esc(s.inv):''}${s.price?' · '+s.price+' ج/وحدة':''}</div></div><button class="tag r" style="border:0" onclick="del('stock',${i})">حذف</button></div>`).reverse().join('')||'<div class="s">مفيش حركة.</div>')+`</div>`}
 return h};
function addStock(t){const items=[...new Set(S.stock.map(s=>s.item))];

 if(sub.crops=='grape'){const V=S.grapes,O=['ري','رش','تسميد','تقليم'];
  h+=`<h2>عنب · العمليات حسب الصنف</h2><div class="card"><table><tr><th>الصنف</th>${O.map(o=>`<th>${o}</th>`).join('')}</tr>${V.map(v=>`<tr><td>${esc(v)}</td>${O.map(o=>`<td>${S.logs.filter(l=>(l.crop||'').includes('عنب')&&(l.crop||'').includes(v)&&l.op==o).length||'—'}</td>`).join('')}</tr>`).join('')}</table></div><button class="btn s" onclick="addGrape()">＋ صنف عنب</button><button class="btn" onclick="addLog()">＋ تسجيل عملية</button>`}
 if(sub.crops=='palm'){h+=`<h2>نخيل مجدول</h2><div class="grid"><div class="card"><b>فسائل</b><div class="s">عدد · تقليع · غرس</div><input type="number" id="pf" placeholder="عدد" value="${S.palm.off}" onchange="S.palm.off=this.value;save()" style="margin-top:8px"><div class="s" style="margin-top:6px">عدد الفسائل</div></div><div class="card"><b>منتج</b><div class="s">تقليم · خدمة · حصاد</div><input type="number" id="pp" placeholder="عدد" value="${S.palm.prod}" onchange="S.palm.prod=this.value;save()" style="margin-top:8px"><div class="s" style="margin-top:6px">عدد النخيل المنتج</div></div></div><div class="card"><b>عمليات النخيل المسجلة</b>${S.logs.filter(l=>/نخيل/.test(l.crop||'')).reverse().map(l=>`<div class="row"><div class="dot">●</div><div class="t">${esc(l.op)} · ${esc(l.crop)}<div class="s">${l.date} ${esc(l.who||'')}</div></div></div>`).join('')||'<div class="s">مفيش عمليات لسه.</div>'}</div><button class="btn" onclick="addLog()">＋ تسجيل عملية</button>`}
 if(sub.crops=='onion'){h+=`<h2>بصل تحت العنب</h2><div class="card">`+['قطعة 19','قطعة 20'].map(p=>`<div class="row"><div class="dot">●</div><div class="t"><b>${p}</b><div class="s">بصل مزروع تحت العنب · ${S.logs.filter(l=>l.crop=='بصل'&&l.plot==p).length} عملية</div></div><span class="tag o">متابعة</span></div>`).join('')+`</div><div class="card">`+(S.logs.filter(l=>l.crop=='بصل').reverse().map(l=>`<div class="row"><div class="dot">●</div><div class="t">${esc(l.op)} · ${esc(l.plot)}<div class="s">${l.date}</div></div></div>`).join('')||'<div class="s">مفيش عمليات بصل لسه.</div>')+`</div><button class="btn" onclick="addLog()">＋ تسجيل عملية</button>`}
 if(sub.crops=='miss'){const by={};S.missing.forEach(m=>{by[m.plot]=by[m.plot]||{m:0,r:0};by[m.plot].m+=num(m.count)*(m.kind=='غيابات'?1:0);by[m.plot].r+=num(m.count)*(m.kind=='اتعوض'?1:0)});['قطعة 19','قطعة 20'].forEach(p=>by[p]=by[p]||{m:0,r:0});
  h+=`<h2>غيابات الشجر لكل قطعة</h2><div class="card"><table><tr><th>القطعة</th><th>الغيابات</th><th>اتعوض</th><th>باقي</th></tr>${Object.entries(by).map(([p,v])=>`<tr><td>${esc(p)}</td><td>${v.m||'—'}</td><td>${v.r||'—'}</td><td>${v.m||v.r?v.m-v.r:'—'}</td></tr>`).join('')}</table></div><button class="btn" onclick="addMiss()">＋ تسجيل غيابات / تعويض</button>`}
 if(sub.crops=='ops'){h+=`<button class="btn" onclick="addLog()">＋ تسجيل عملية</button><div class="card" style="margin-top:10px">`+(S.logs.map((l,i)=>`<div class="row"><div class="dot">●</div><div class="t">${esc(l.op)} · ${esc(l.crop)} · ${esc(l.plot)}<div class="s">${l.date} · ${esc(l.who||'')} ${l.note?'· '+esc(l.note):''}</div></div><button class="tag r" style="border:0" onclick="del('logs',${i})">حذف</button></div>`).reverse().join('')||'<div class="s">مفيش عمليات مسجلة.</div>')+`</div>`}
 return h};
sub.crops='grape';
/* ---- money (screens 4, 9, 10) ---- */
const _money=R.money;
function stepM(d){const[y,m]=(window.curM||today().slice(0,7)).split('-').map(Number);const x=new Date(y,m-1+d,1);window.curM=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');render()}
R.money=()=>{let h=_money();
 h=h.replace(/<select onchange="curM=this\.value;render\(\)">[\s\S]*?<\/select>/,`<div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:6px"><button class="tag" style="border:0;padding:8px 14px" onclick="stepM(-1)">›</button><span class="tag" style="background:#2f6b3a;color:#fff;padding:8px 18px">${window.curM||today().slice(0,7)}</span><button class="tag" style="border:0;padding:8px 14px" onclick="stepM(1)">‹</button></div>`);
 if(sub.money=='cash'){const cm=window.curM||today().slice(0,7);const rows=S.cash.filter(c=>c.date.slice(0,7)==cm&&c.dir=='out');const grp={};rows.forEach(r=>{const k=r.plot||'عام';grp[k]=(grp[k]||0)+num(r.amt)});const mx=Math.max(1,...Object.values(grp));
  h+=`<h2>المصروفات حسب القسم</h2><div class="card">`+(Object.entries(grp).map(([k,v])=>`<div class="row"><div class="t">${esc(k)}<div style="height:8px;background:#eee;border-radius:5px;margin-top:6px;overflow:hidden"><div style="height:100%;width:${v/mx*100}%;background:#4f8a3c"></div></div></div><b>${fmt(v)}</b></div>`).join('')||'<div class="s">مفيش مصروفات في الشهر ده.</div>')+`</div>`}
 else{const tot=Math.round(520-65);h=h.replace('</table>',`<tr><td>الأرض الفارغة</td><td>${tot}</td><td>—</td><td>—</td></tr></table>`)+`<h2>التكلفة بتتجمع من</h2><div class="card"><div class="row"><div class="dot">●</div><div class="t"><b>صرف المخازن</b><div class="s">أسمدة ومبيدات وسولار (كمية × سعر الوحدة)</div></div></div><div class="row"><div class="dot">●</div><div class="t"><b>العمالة</b><div class="s">يوميات الشغل على القطعة</div></div></div><div class="row"><div class="dot">●</div><div class="t"><b>المعدات والمصروفات</b><div class="s">حسب القطعة</div></div></div></div>`}
 return h};
/* ---- visits + fence (screen 11) ---- */
function convRec(i){const v=S.visits[i];dlg(`<h2>حوّل التوصيات لمهمة</h2><div class="s">${esc(v.rec||'')}</div><label>مين ينفذ</label><select id="cw">${opt(WORKERS)}</select><button class="btn" onclick="S.tasks.push({op:'توصية استشاري',plot:S.visits[${i}].plot,who:f('cw'),date:today(),note:S.visits[${i}].rec});save();close();go('team')">إنشاء المهمة</button><button class="btn s" onclick="close()">إلغاء</button>`)}
const _sec=R.sec;
R.sec=()=>{if(sub.more=='vf'){const a=sub.more;sub.more='visits';let v=_sec();sub.more='fence';let fz=_sec();sub.more=a;
  v=v.replace(/<div class="chips">[\s\S]*?<\/div>/,'').replace(/(<button class="tag r"[^>]*onclick="del\('visits',(\d+)\)")/g,'<button class="tag" style="border:0;margin-top:6px" onclick="convRec($2)">حوّل لمهمة</button> $1');
  fz=fz.replace(/<div class="chips">[\s\S]*?<\/div>/,'');return `<h2>زيارات الاستشاريين</h2>${v}<h2>عمليات الأسوار (جازورين)</h2>${fz}`}
  return _sec()};

R.team=()=>{let h=_team();h=h.replace(/<div class="s">\$\{esc\(t\.who\)\}/g,'$&');
 if(sub.team=='tasks'){h=h.replace(/(<div class="card"><div class="row" style="border:0"><div class="t"><b>[^<]*<\/b>)/g,'$1');}
