<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>شركة طايو</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;background:#f4f1e8;color:#23301f;padding-bottom:90px;font-size:14px}
header{background:linear-gradient(160deg,#2f6b3a,#4f8a3c);color:#fff;padding:22px 18px 18px;border-radius:0 0 26px 26px}
header small{opacity:.85;font-size:12px}header h1{font-size:20px;margin-top:3px}
main{padding:14px}h2{font-size:15px;margin:14px 2px 8px}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(40,50,30,.07)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border-radius:14px;padding:10px;text-align:center;font-size:11px;color:#7a8570}.kpi b{display:block;font-size:20px;color:#23301f}
.plot{border-radius:16px;padding:14px;color:#fff;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}.plot .n{font-size:26px;font-weight:700}.plot .n span{font-size:12px;font-weight:400}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-radius:20px 20px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.1);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 2px 12px;font:inherit;font-size:11px;color:#8a937f}nav button.on{color:#2f6b3a;font-weight:700}nav i{display:block;font-style:normal;font-size:18px}
label{display:block;font-size:12px;color:#6b705f;margin:8px 0 3px}
input,select,textarea{width:100%;border:1.5px solid #d9d5c4;border-radius:10px;padding:10px;font:inherit;background:#fff}
.btn{display:block;width:100%;border:0;background:#2f6b3a;color:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:700;margin-top:10px}
.btn.s{background:#e6efd9;color:#2f6b3a}.btn.o{background:#b7791f}.btn.r{background:#c0392b}
.row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.row .t{flex:1}.row .s{font-size:11px;color:#7a8570}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:#e6efd9;color:#2f6b3a;white-space:nowrap}.tag.o{background:#fdebd0;color:#b7791f}.tag.r{background:#fadbd8;color:#b03a2e}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chips button{border:0;background:#fff;border-radius:20px;padding:7px 12px;font:inherit;font-size:12px}.chips button.on{background:#2f6b3a;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:12px}th{color:#7a8570;font-weight:400;text-align:center;padding:6px 2px;border-bottom:1px solid #eee}td{text-align:center;padding:8px 2px;border-bottom:1px solid #f1efe6}td:first-child{text-align:right;font-weight:700}
.note{font-size:11px;color:#9aa38f;text-align:center;margin:8px 0}img.ph{width:54px;height:54px;object-fit:cover;border-radius:8px}
dialog{border:0;border-radius:18px;padding:14px;width:92%;max-width:420px;margin:auto}dialog::backdrop{background:rgba(0,0,0,.4)}
.road{background:repeating-linear-gradient(90deg,#8a8575 0 8px,#a39e8d 8px 16px);height:14px;border-radius:4px;margin:6px 0;color:#fff;font-size:9px;text-align:center}
.mr{display:flex;gap:4px;margin-bottom:3px;align-items:center;font-size:10px}.mr b{width:20px;color:#7a8570}.mr span.c{flex:1;background:#e4e0d2;border:1px dashed #c9c3ae;border-radius:6px;text-align:center;padding:4px 0}.mr span.w{background:#2b7a8c;color:#fff;border-radius:8px;padding:2px 5px}
</style></head><body>
<header><small id="hs">شركة طايو · دير مواز</small><h1 id="ht"></h1></header>
<main id="m"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const GROUPS=[['نخيل',15,'#b7791f'],['عنب إيرلي سويت',10,'#7b3f8c'],['H4 منتج',20,'#2f6b3a'],['H4 تربية',20,'#2b7a8c']];
const CATS=['أسمدة','مبيدات','سولار','بنزين','معدات وأدوات','مستلزمات سكن','قطع غيار'];
const CASH=['صيانة','عمالة مؤقتة','مرتبات العمالة الدائمة','علاج','إكراميات','كهرباء','مستلزمات سكن','معدات وأدوات','أخرى'];
const OPS=['تقليم','تربية','حشائش','ري','تسميد','رش','تلقيح','حصاد','تنضيف','أخرى'];
const CROPS=['عنب','نخيل - فسائل','نخيل - منتج','بصل','أخرى'];
const BLOCKS=['A','B','C'];
const WORKERS=['عامل الري','سواق الجرار','سواق عربية النيسان','عامل 1','عامل 2','عامل 3','عامل 4','عامل 5','مهندس 1','مهندس 2','المحاسب'];
const TABS=[['home','الرئيسية','🏡'],['crops','المحاصيل','🌱'],['stores','المخازن','📦'],['money','الحسابات','💰'],['team','الفريق','👷'],['more','المزيد','☰']];
let S=JSON.parse(localStorage.getItem('tayo')||'null')||{plots:['قطعة 19','قطعة 20','الأسوار (جازورين)','عام'],grapes:['إيرلي سويت'],logs:[],stock:[],cash:[],missing:[],visits:[],tasks:[],fence:{done:0,total:5}};
const save=()=>{try{localStorage.setItem('tayo',JSON.stringify(S))}catch(e){alert('المساحة امتلت. اعمل نسخة احتياطية من (المزيد) وامسح صور قديمة.')}};
const allPlots=()=>[...GROUPS.map(g=>g[0]),...S.plots];
const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
const today=()=>new Date().toISOString().slice(0,10);
const num=v=>+v||0, fmt=n=>n.toLocaleString('ar-EG',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='home',sub={crops:'ops',stores:'bal',money:'cash',team:'tasks',more:'main'};
function nav(){ $('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')"><i>${t[2]}</i>${t[1]}</button>`).join('')}
function go(t){tab=t;render();scrollTo(0,0)}
function chips(key,list){return `<div class="chips">`+list.map(([k,l])=>`<button class="${sub[key]==k?'on':''}" onclick="sub['${key}']='${k}';render()">${l}</button>`).join('')+`</div>`}
function dlg(html){const d=$('#dlg');d.innerHTML=html;d.showModal()}
function close(){$('#dlg').close()}
function f(id){return $('#'+id).value}
function resize(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.55))};im.src=r.result};r.readAsDataURL(file)}
let tmpPhoto='';
function photoField(){tmpPhoto='';return `<label>صورة (اختياري)</label><input type="file" accept="image/*" capture="environment" onchange="resize(this.files[0],d=>{tmpPhoto=d;$('#pv').src=d;$('#pv').style.display='block'})"><img id="pv" class="ph" style="display:none;margin-top:6px">`}
function del(key,i){if(confirm('تحذف السطر ده؟')){S[key].splice(i,1);save();render()}}
const R={};
R.home=()=>{
 const tk=S.tasks.filter(t=>!t.end).length;
 return `<div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><b>520</b>فدان إجمالي</div><div class="kpi"><b>65</b>فدان مزروع</div><div class="kpi"><b>${tk}</b>مهام شغالة</div></div>
 <h2>المزروع (65 فدان من 520)</h2><div class="grid">${GROUPS.map(g=>`<div class="plot" style="background:${g[2]}"><b>${g[0]}</b><div class="n">${g[1]} <span>فدان</span></div></div>`).join('')}</div>
 <h2>آخر الأعمال</h2><div class="card">${S.logs.slice(-4).reverse().map(l=>`<div class="row"><div class="t">${esc(l.op)} · ${esc(l.plot)}<div class="s">${l.date} ${esc(l.who||'')}</div></div></div>`).join('')||'<div class="s">لسه مفيش. سجّل من (المحاصيل).</div>'}</div>
 <a class="btn s" style="text-align:center;text-decoration:none" href="https://www.google.com/maps/search/?api=1&query=27.639592%2C30.568271" target="_blank">🗺️ افتح موقع المزرعة على الخريطة</a>`};
R.crops=()=>{
 let h=chips('crops',[['ops','العمليات'],['miss','الغيابات'],['onion','البصل']]);
 if(sub.crops=='ops'){
  h+=`<button class="btn" onclick="addLog()">＋ تسجيل عملية</button><div class="card" style="margin-top:10px">`+
  (S.logs.map((l,i)=>`<div class="row"><div class="t">${esc(l.op)} · ${esc(l.crop)} · ${esc(l.plot)}<div class="s">${l.date} · ${esc(l.who||'')} ${l.note?'· '+esc(l.note):''}</div></div><button class="tag r" style="border:0" onclick="del('logs',${i})">حذف</button></div>`).reverse().join('')||'<div class="s">مفيش عمليات مسجلة.</div>')+`</div>`;
 }
 if(sub.crops=='miss'){
  const by={};S.missing.forEach(m=>{by[m.plot]=by[m.plot]||{m:0,r:0};by[m.plot].m+=num(m.count)*(m.kind=='غيابات'?1:0);by[m.plot].r+=num(m.count)*(m.kind=='اتعوض'?1:0)});
  h+=`<button class="btn" onclick="addMiss()">＋ تسجيل غيابات / تعويض</button><div class="card" style="margin-top:10px"><table><tr><th>القطعة</th><th>الغيابات</th><th>اتعوض</th><th>باقي</th></tr>${Object.entries(by).map(([p,v])=>`<tr><td>${esc(p)}</td><td>${v.m}</td><td>${v.r}</td><td>${v.m-v.r}</td></tr>`).join('')||'<tr><td colspan=4 class="s">مفيش تسجيل لسه</td></tr>'}</table></div>`;
 }
 if(sub.crops=='onion'){
  h+=`<div class="card"><b>بصل تحت العنب (قطعة 19 و20)</b><div class="s">سجّل عملياته من تبويب العمليات واختار المحصول "بصل".</div></div><div class="card">`+(S.logs.filter(l=>l.crop=='بصل').map(l=>`<div class="row"><div class="t">${esc(l.op)} · ${esc(l.plot)}<div class="s">${l.date}</div></div></div>`).join('')||'<div class="s">مفيش عمليات بصل لسه.</div>')+`</div>`;
 }
 return h};
function addLog(){dlg(`<h2>عملية جديدة</h2><label>العملية</label><select id="a1">${opt(OPS)}</select><label>المحصول</label><select id="a2">${opt(CROPS)}</select><label>الصنف (للعنب)</label><select id="a3"><option value="">-</option>${opt(S.grapes)}</select><label>القطعة</label><select id="a4">${opt(allPlots())}</select><label>التاريخ</label><input type="date" id="a5" value="${today()}"><label>مين اشتغل</label><select id="a6">${opt(WORKERS)}</select><label>ملاحظات</label><textarea id="a7" rows="2"></textarea><button class="btn" onclick="S.logs.push({op:f('a1'),crop:f('a2')+(f('a3')?' - '+f('a3'):''),plot:f('a4'),date:f('a5'),who:f('a6'),note:f('a7')});save();close();render()">حفظ</button><button class="btn s" onclick="close()">إلغاء</button>`)}
function addMiss(){dlg(`<h2>غيابات الشجر</h2><label>القطعة (كود)</label><select id="a1">${opt(allPlots())}</select><label>النوع</label><select id="a2"><option>غيابات</option><option>اتعوض</option></select><label>العدد</label><input type="number" id="a3"><button class="btn" onclick="S.missing.push({plot:f('a1'),kind:f('a2'),count:f('a3'),date:today()});save();close();render()">حفظ</button><button class="btn s" onclick="close()">إلغاء</button>`)}
function balances(){const b={};S.stock.forEach(s=>{const k=s.cat+'|'+s.item+'|'+s.unit;b[k]=(b[k]||0)+(s.type=='in'?1:-1)*num(s.qty)});return b}
R.stores=()=>{
 let h=chips('stores',[['bal','الأرصدة'],['mov','الحركة']]);
 h+=`<div class="two"><button class="btn s" onclick="addStock('in')">＋ استلام</button><button class="btn o" onclick="addStock('out')">－ صرف</button></div><div style="height:10px"></div>`;
 if(sub.stores=='bal'){const b=balances();
  h+=CATS.map(c=>{const it=Object.entries(b).filter(([k])=>k.startsWith(c+'|'));return `<div class="card"><b>${c}</b>${it.map(([k,v])=>{const[,n,u]=k.split('|');return `<div class="row"><div class="t">${esc(n)}</div><span class="tag ${v<=0?'r':''}">${fmt(v)} ${esc(u)}</span></div>`}).join('')||'<div class="s">لا يوجد حركة</div>'}</div>`}).join('');
 } else {h+=`<div class="card">`+(S.stock.map((s,i)=>`<div class="row">${s.photo?`<img class="ph" src="${s.photo}">`:''}<div class="t">${s.type=='in'?'استلام':'صرف'} · ${esc(s.cat)} · ${esc(s.item)} ${fmt(num(s.qty))} ${esc(s.unit)}<div class="s">${s.date} · ${esc(s.party||'')} ${s.plot?'· '+esc(s.plot):''} ${s.inv?'· فاتورة '+esc(s.inv):''}${s.price?' · '+s.price+' ج/وحدة':''}</div></div><button class="tag r" style="border:0" onclick="del('stock',${i})">حذف</button></div>`).reverse().join('')||'<div class="s">مفيش حركة.</div>')+`</div>`}
 return h};
function addStock(t){const items=[...new Set(S.stock.map(s=>s.item))];
 dlg(`<h2>${t=='in'?'استلام':'صرف'}</h2><label>القسم</label><select id="a1">${opt(CATS)}</select><label>الصنف</label><input id="a2" list="il" placeholder="اسم الصنف"><datalist id="il">${opt(items)}</datalist><div class="two"><div><label>الكمية</label><input type="number" id="a3" step="any"></div><div><label>الوحدة</label><input id="a4" value="${t=='in'?'':'' }" placeholder="لتر / كيس / قطعة"></div></div><label>سعر الوحدة (جنيه)</label><input type="number" id="a5" step="any">${t=='in'?'<label>المورد</label><input id="a6"><label>رقم الفاتورة</label><input id="a7">':'<label>للقطعة / العملية</label><select id="a8">'+opt(allPlots())+'</select><label>اللي استلم</label><select id="a6">'+opt(WORKERS)+'</select>'}<label>التاريخ</label><input type="date" id="a9" value="${today()}">${photoField()}<button class="btn" onclick="saveStock('${t}')">حفظ</button><button class="btn s" onclick="close()">إلغاء</button>`)}
function saveStock(t){if(!f('a2')||!num(f('a3')))return alert('اكتب الصنف والكمية');
 S.stock.push({type:t,cat:f('a1'),item:f('a2').trim(),qty:f('a3'),unit:f('a4').trim()||'وحدة',price:f('a5'),party:f('a6'),inv:t=='in'?f('a7'):'',plot:t=='out'?f('a8'):'',date:f('a9'),photo:tmpPhoto});save();close();render()}
R.money=()=>{
 let h=chips('money',[['cash','التدفق الشهري'],['cost','تكلفة القطع']]);
 if(sub.money=='cash'){const mo=today().slice(0,7),ms=[...new Set([mo,...S.cash.map(c=>c.date.slice(0,7))])].sort().reverse();
  const cm=window.curM||mo;window.curM=cm;
  const rows=S.cash.filter(c=>c.date.slice(0,7)==cm);const tot=k=>rows.filter(c=>c.dir==k).reduce((a,c)=>a+num(c.amt),0);
  h+=`<select onchange="curM=this.value;render()">${ms.map(m=>`<option ${m==cm?'selected':''}>${m}</option>`).join('')}</select>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin:10px 0"><div class="kpi"><b>${fmt(tot('in'))}</b>داخل</div><div class="kpi"><b>${fmt(tot('out'))}</b>خارج</div><div class="kpi"><b>${fmt(tot('in')-tot('out'))}</b>الصافي</div></div>
  <div class="card"><b>المصروفات</b>${CASH.map(c=>`<div class="row"><div class="t">${c}</div><b>${fmt(rows.filter(r=>r.dir=='out'&&r.cat==c).reduce((a,r)=>a+num(r.amt),0))}</b></div>`).join('')}</div>
  <div class="two"><button class="btn" onclick="addCash('out')">－ مصروف</button><button class="btn s" onclick="addCash('in')">＋ إيراد</button></div>
  <div class="card" style="margin-top:10px">${rows.map(r=>`<div class="row"><div class="t">${r.dir=='in'?'إيراد':esc(r.cat)}${r.plot?' · '+esc(r.plot):''}<div class="s">${r.date} ${esc(r.note||'')}</div></div><b>${fmt(num(r.amt))}</b><button class="tag r" style="border:0" onclick="del('cash',${S.cash.indexOf(r)})">حذف</button></div>`).join('')||'<div class="s">مفيش حركة في الشهر ده.</div>'}</div>`;
 } else {
  const cost={};const add=(p,v)=>cost[p]=(cost[p]||0)+v;
  S.cash.filter(c=>c.dir=='out'&&c.plot).forEach(c=>add(c.plot,num(c.amt)));
  S.stock.filter(s=>s.type=='out'&&s.plot).forEach(s=>add(s.plot,num(s.qty)*num(s.price)));
  h+=`<div class="card"><table><tr><th>القطعة</th><th>فدان</th><th>التكلفة</th><th>للفدان</th></tr>${GROUPS.map(g=>`<tr><td>${g[0]}</td><td>${g[1]}</td><td>${fmt(cost[g[0]]||0)}</td><td>${fmt((cost[g[0]]||0)/g[1])}</td></tr>`).join('')}${S.plots.concat(['عام']).filter((x,i,a)=>a.indexOf(x)==i&&cost[x]).map(p=>`<tr><td>${esc(p)}</td><td>-</td><td>${fmt(cost[p])}</td><td>-</td></tr>`).join('')}</table></div><div class="note">التكلفة = صرف المخازن (كمية × سعر الوحدة) + المصروفات المربوطة بقطعة. اختار القطعة وقت التسجيل.</div>`;
 }
 return h};
function addCash(d){dlg(`<h2>${d=='out'?'مصروف':'إيراد'}</h2>${d=='out'?'<label>البند</label><select id="a1">'+opt(CASH)+'</select>':'<label>مصدر الإيراد</label><input id="a1" placeholder="مبيعات ..">'}<label>المبلغ (جنيه)</label><input type="number" id="a2" step="any"><label>القطعة (اختياري)</label><select id="a3"><option value="">-</option>${opt(allPlots())}</select><label>التاريخ</label><input type="date" id="a4" value="${today()}"><label>ملاحظة</label><input id="a5"><button class="btn" onclick="if(!num(f('a2')))return alert('اكتب المبلغ');S.cash.push({dir:'${d}',cat:f('a1'),amt:f('a2'),plot:f('a3'),date:f('a4'),note:f('a5')});save();close();render()">حفظ</button><button class="btn s" onclick="close()">إلغاء</button>`)}
// ---- team
const hhmm=t=>new Date(t).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
function gps(cb){if(!navigator.geolocation)return cb(null,'الجهاز مش بيدعم تحديد الموقع');navigator.geolocation.getCurrentPosition(p=>cb({lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6)}),e=>cb(null,'الموقع مش متاح (لازم تسمح للتطبيق ويتفتح من رابط https)'),{enableHighAccuracy:true,timeout:12000})}
R.team=()=>{
 let h=chips('team',[['tasks','المهام'],['map','المواقع']]);
 if(sub.team=='tasks'){h+=`<button class="btn" onclick="addTask()">＋ مهمة جديدة</button><div style="height:8px"></div>`+
  S.tasks.map((t,i)=>`<div class="card"><div class="row" style="border:0"><div class="t"><b>${esc(t.op)} · ${esc(t.plot)}</b><div class="s">${esc(t.who)} · ${t.date}${t.start?' · بدأ '+hhmm(t.start):''}${t.end?' · خلص '+hhmm(t.end):''}</div></div><span class="tag ${t.end?'':t.start?'o':'r'}">${t.end?'تمت':t.start?'شغالة':'جديدة'}</span></div>
  ${t.pos?`<div class="s">📍 <a href="https://www.google.com/maps?q=${t.pos.lat},${t.pos.lon}" target="_blank">${t.pos.lat}, ${t.pos.lon}</a></div>`:t.posErr?`<div class="s">${esc(t.posErr)}</div>`:''}
  ${t.photo?`<img class="ph" src="${t.photo}" style="width:100%;height:150px;margin-top:6px">`:''}
  ${!t.start?`<button class="btn s" onclick="startTask(${i})">▶ بدأت</button>`:!t.end?`<button class="btn o" onclick="endTask(${i})">✔ خلصت + صورة</button>`:''}
  <button class="tag r" style="border:0;margin-top:8px" onclick="del('tasks',${i})">حذف</button></div>`).reverse().join('')||'<div class="card s">مفيش مهام.</div>';
  h+=`<div class="note">الموقع بيتسجل لحظة "بدأت" ولحظة "خلصت" بس، مش تتبع مستمر. لازم العامل يعرف ده.</div>`}
 else {h+=`<div class="card">`+(S.tasks.filter(t=>t.pos).map(t=>`<div class="row"><div class="t">${esc(t.who)} · ${esc(t.op)} ${esc(t.plot)}<div class="s">${t.date}</div></div><a class="tag" target="_blank" href="https://www.google.com/maps?q=${t.pos.lat},${t.pos.lon}">خريطة</a></div>`).join('')||'<div class="s">مفيش مواقع مسجلة.</div>')+`</div>`}
 return h};
function addTask(){dlg(`<h2>مهمة</h2><label>العملية</label><select id="a1">${opt(OPS)}</select><label>القطعة</label><select id="a2">${opt(allPlots())}</select><label>مين</label><select id="a3">${opt(WORKERS)}</select><button class="btn" onclick="S.tasks.push({op:f('a1'),plot:f('a2'),who:f('a3'),date:today()});save();close();render()">إضافة</button><button class="btn s" onclick="close()">إلغاء</button>`)}
function startTask(i){const t=S.tasks[i];t.start=Date.now();gps((p,e)=>{if(p)t.pos=p;else t.posErr=e;save();render()});save();render()}
function endTask(i){dlg(`<h2>خلصت</h2>${photoField()}<button class="btn" onclick="finTask(${i})">تأكيد</button><button class="btn s" onclick="close()">إلغاء</button>`)}
function finTask(i){const t=S.tasks[i];t.end=Date.now();t.photo=tmpPhoto;S.logs.push({op:t.op,crop:'',plot:t.plot,date:today(),who:t.who,note:'من المهام'});if(!t.pos)gps((p,e)=>{if(p)t.pos=p;else t.posErr=e;save();render()});save();close();render()}
R.more=()=>{
 let h=chips('more',[['main','الأقسام'],['visits','الاستشاريين'],['fence','جازورين'],['land','الأرض'],['data','بيانات']]);
 if(sub.more=='main')h+=`<div class="card"><div class="row"><div class="t">العمال</div><span class="s">${WORKERS.length}</span></div><div class="row"><div class="t">أصناف العنب</div><span class="s">${esc(S.grapes.join('، '))}</span></div><button class="btn s" onclick="addGrape()">＋ صنف عنب</button><button class="btn s" onclick="addPlot()">＋ قطعة / كود</button></div><div class="note">القطع: ${esc(allPlots().join('، '))}</div>`;
 if(sub.more=='visits')h+=`<button class="btn" onclick="addVisit()">＋ زيارة استشاري</button><div style="height:8px"></div>`+(S.visits.map((v,i)=>`<div class="card"><b>${esc(v.who)}</b> · ${v.date}<div class="s">${esc(v.plot)}</div><p style="margin-top:6px">${esc(v.notes)}</p><div class="s">التوصيات: ${esc(v.rec)}</div>${v.photo?`<img class="ph" src="${v.photo}">`:''}<button class="tag r" style="border:0;margin-top:6px" onclick="del('visits',${i})">حذف</button></div>`).reverse().join('')||'<div class="card s">مفيش زيارات.</div>');
 if(sub.more=='fence'){const p=S.fence.total?Math.round(S.fence.done/S.fence.total*100):0;h+=`<div class="card"><b>تقليم ونضافة جازورين (الجهتين)</b><div style="height:10px;background:#eee;border-radius:6px;margin:10px 0;overflow:hidden"><div style="height:100%;width:${p}%;background:#4f8a3c"></div></div><div class="two"><div><label>كم خلص</label><input type="number" step="any" id="fd" value="${S.fence.done}"></div><div><label>الإجمالي (كم)</label><input type="number" step="any" id="ft" value="${S.fence.total}"></div></div><button class="btn" onclick="S.fence={done:num(f('fd')),total:num(f('ft'))};save();render()">حفظ التقدم (${p}%)</button></div>`}
 if(sub.more=='land')h+=`<div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><b>520</b>فدان</div><div class="kpi"><b>65</b>مزروع</div><div class="kpi"><b>10</b>آبار</div></div><div class="card" style="margin-top:10px"><b>الأرض 3 بلوكات A و B و C</b><div class="s">طريق بين A و B وطريق بين B و C (حوالي 15 م عرض × 5 كم).</div><div class="road">طريق</div><div class="two" style="text-align:center;margin:6px 0"><div class="kpi">A</div><div class="kpi">B</div></div><div class="road">طريق</div><div class="kpi" style="margin:6px 0">C</div></div><div class="note">تحديد كل قطعة فيها إيه هيتم من (المزيد › الأقسام › قطعة / كود) بعد ما تأكد تقسيم البلوكات.</div>`;
 if(sub.more=='data')h+=`<div class="card"><div class="s">البيانات محفوظة على الموبايل ده بس.</div><button class="btn" onclick="exp_()">نسخة احتياطية (تحميل)</button><label>استرجاع من نسخة</label><input type="file" accept=".json" onchange="imp(this.files[0])"><button class="btn r" onclick="if(confirm('تمسح كل البيانات؟')){localStorage.removeItem('tayo');location.reload()}">مسح كل البيانات</button></div>`;
 return h};
function addGrape(){const v=prompt('اسم الصنف');if(v){S.grapes.push(v);save();render()}}
function addPlot(){const v=prompt('كود أو اسم القطعة (مثلا قطعة 5)');if(v){S.plots.push(v);save();render()}}
function addVisit(){dlg(`<h2>زيارة استشاري</h2><label>الاسم</label><input id="a1"><label>القطعة / المحصول</label><select id="a2">${opt(allPlots())}</select><label>التاريخ</label><input type="date" id="a3" value="${today()}"><label>الملاحظات</label><textarea id="a4" rows="3"></textarea><label>التوصيات</label><textarea id="a5" rows="3"></textarea>${photoField()}<button class="btn" onclick="S.visits.push({who:f('a1'),plot:f('a2'),date:f('a3'),notes:f('a4'),rec:f('a5'),photo:tmpPhoto});save();close();render()">حفظ</button><button class="btn s" onclick="close()">إلغاء</button>`)}
function exp_(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='tayo-backup-'+today()+'.json';a.click()}
function imp(file){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render()}catch(e){alert('الملف غلط')}};r.readAsText(file)}
function render(){$('#ht').textContent={home:'شركة طايو · 520 فدان',crops:'المحاصيل والعمليات',stores:'المخازن · استلام وصرف',money:'الحسابات',team:'متابعة الفريق',more:'المزيد'}[tab];$('#m').innerHTML=R[tab]();nav()}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
