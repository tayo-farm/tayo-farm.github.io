const SYNC_URL='https://tayo-farm-db.alimaan-shop.workers.dev/',SCOLS=['logs','stock','cash','missing','visits','tasks','polys'];
let SY={busy:false,last:0,err:'',snap:JSON.parse(localStorage.getItem('tayo_snap')||'{}'),t:0};
const syCode=()=>localStorage.getItem('tayo_code')||'';
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function syStrip(r){const o={};for(const k in r)if(k[0]!='_')o[k]=r[k];return JSON.stringify(o)}
function syBuild(){const data={},cur={};let dirty=false;const now=Date.now();const pend={};
 SCOLS.forEach(c=>{S[c]=S[c]||[];data[c]=[];S[c].forEach(r=>{if(!r._id){r._id=rid();r._c=now}const s=syStrip(r);cur[r._id]=1;if(SY.snap[r._id]!==s){r._u=now;pend[r._id]=s;data[c].push(r);dirty=true}})});
 const del=Object.keys(SY.snap).filter(id=>!cur[id]);if(del.length)dirty=true;
 return {data,del,dirty,pend}}
async function syncNow(force){if(SY.busy||!syCode())return;const b=syBuild();if(!b.dirty&&!force)return;SY.busy=true;
 try{const r=await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:syCode(),data:b.data,del:b.del})});const j=await r.json();
  if(!r.ok){SY.err=j.error=='wrong code'?'الكود غلط':'خطأ '+(j.error||r.status);if(j.error=='wrong code')localStorage.removeItem('tayo_code')}
  else{SY.err='';Object.assign(SY.snap,b.pend);b.del.forEach(id=>delete SY.snap[id]);let ch=false;
   SCOLS.forEach(c=>{const srv=j.cols[c]||[];const a=JSON.stringify(S[c].map(x=>x._id+'|'+x._u)),n=JSON.stringify(srv.map(x=>x._id+'|'+x._u));if(a!==n){S[c]=srv;srv.forEach(x=>{SY.snap[x._id]=syStrip(x)});ch=true}});
   const gone=new Set(j.dels||[]);Object.keys(SY.snap).forEach(id=>{if(gone.has(id))delete SY.snap[id]});
   SY.last=Date.now();localStorage.setItem('tayo_snap',JSON.stringify(SY.snap));if(ch){save();const d=document.getElementById('dlg');if(!(d&&d.open)&&!(typeof LV!='undefined'&&LV.draw))render()}}
 }catch(e){SY.err='مفيش اتصال'}finally{SY.busy=false}}
function syCodeDlg(){dlg(`<h2>كود المزرعة</h2><div class="s" style="font-size:12px;margin-bottom:6px">أول واحد يكتب كود بيحدد كود المزرعة، وبعدين كل التليفونات تكتب نفس الكود. 6 حروف/أرقام على الأقل. متقولوش الكود لحد برا الفريق.</div><input id="a1" type="password" placeholder="الكود"><button class="btn" onclick="localStorage.setItem('tayo_code',f('a1'));closeD();syncNow(true).then(render)">حفظ ومزامنة</button><button class="btn s" onclick="closeD()">إلغاء</button>`)}
const _h3=R.home;R.home=()=>{const on=!!syCode();const t=SY.last?new Date(SY.last).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'';
 return `<div class="card" style="display:flex;align-items:center;gap:10px"><div style="flex:1;font-size:13px"><b>☁️ مزامنة الفريق</b><div class="s" style="font-size:11px;color:${SY.err?'#c0392b':'#5b6b4f'}">${on?(SY.err||(t?'متزامن · '+t:'بيتزامن…')):'مش متفعلة · الشغل على التليفون ده بس'}</div></div><button class="btn" style="width:auto;margin:0;padding:10px 16px" onclick="${on?"syncNow(true).then(render)":"syCodeDlg()"}">${on?'🔄 تحديث':'تفعيل'}</button></div>`+_h3()};
setInterval(()=>{if(!document.hidden)syncNow(false)},6000);setInterval(()=>{if(!document.hidden)syncNow(true)},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow(true)});
if(syCode())setTimeout(()=>syncNow(true),800);

render();
